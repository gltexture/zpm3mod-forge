import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        //mavenLocal()
        flatDir {
            dirs 'libs'
        }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
        classpath 'org.parchmentmc:librarian:1.+'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.2.0'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            workingDirectory project.file("run")
            args '--username', 'Dev'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "zpm3.guns.mixins.json"
    config "zpm3.main.mixins.json"
    config "zpm3.common.mixins.json"
    config "zpm3.mob_effects.mixins.json"
    config "zpm3.entities.mixins.json"
    config "zpm3.blocks.mixins.json"
    config "zpm3.fluids.mixins.json"
    config "zpm3.food_medicine.mixins.json"
    config "zpm3.melee_tools.mixins.json"
    config "zpm3.misc_items.mixins.json"
    config "zpm3.player.mixins.json"
    config "zpm3.debug.mixins.json"
    config "zpm3.net_pack.mixins.json"
    config "zpm3.ui.mixins.json"
    config "zpm3.oculus_compat.mixins.json"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    minecraftLibrary 'io.github.spair:imgui-java-binding:1.92.7.1'

    minecraftLibrary('io.github.spair:imgui-java-lwjgl3:1.92.7.1') {
        exclude group: 'org.lwjgl'
    }

    minecraftLibrary 'io.github.spair:imgui-java-natives-windows:1.92.7.1'
    minecraftLibrary 'io.github.spair:imgui-java-natives-linux:1.92.7.1'
    minecraftLibrary 'io.github.spair:imgui-java-natives-macos:1.92.7.1'

    ///implementation fg.deobf("blank:vss-0.2.10-forge-1.20.1:0.2.10")
    //implementation fg.deobf("blank:DistantHorizons-2.4.5-b-1.20.1-fabric-forge:2.4.5-b")
    implementation fg.deobf("blank:DistantHorizons-3.2.0-b-1.20.1-fabric-forge:3.2.0-b")
    implementation fg.deobf("blank:embeddium-0.3.31+mc1.20.1:0.3.31")
    implementation fg.deobf("blank:oculus-mc1.20.1-1.8.0:1.8.0")
    implementation fg.deobf("blank:worldedit-mod-7.2.15-1.20.1-fabric-forge:7.2.15")
    
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.4"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.4")) {
        jarJar.ranged(it, "[0.5.4,)")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

/*
    from {
        project.configurations.minecraftLibrary.findAll {
            it.name.contains('imgui-java-')
        }.collect { it.isDirectory() ? it : zipTree(it) }
    }
 */

tasks.named('jar', Jar).configure {
    from sourceSets.main.output

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.matching { it.name == "runData" }.configureEach {
    systemProperty "zpm3.datagen", "true"
}

tasks.register('zpShadow') {
    dependsOn 'reobfJar'

    doLast {
        def sourceJar = file(tasks.jar.archiveFile)
        def outputJar = file("${buildDir}/libs/${project.name}-${project.version}-imgui.jar")

        copy {
            from sourceJar
            into temporaryDir
            rename { 'base.jar' }
        }

        def baseJar = file("${temporaryDir}/base.jar")

        ant.zip(destfile: outputJar, update: false) {
            zipfileset(src: baseJar)

            configurations.minecraftLibrary
                    .findAll {
                        it.name.contains('imgui-java-binding') ||
                                it.name.contains('imgui-java-lwjgl3') ||
                                it.name.contains('imgui-java-natives-')
                    }
                    .each { dependency ->
                        zipfileset(src: dependency) {
                            exclude(name: 'META-INF/**')
                            exclude(name: 'LICENSE/**')
                        }
                    }
        }
    }
}

tasks.named('build') {
    dependsOn 'zpShadow'
}